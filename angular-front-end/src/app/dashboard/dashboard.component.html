<div class="dashboard">
    <aside class="sidebar">
        <h1>Dashboard</h1>
        <p class="subtitle">Choose where you want to go next.</p>

        <nav class="panel">
            <a routerLink="/dashboard/accounts">Account page</a>
            <a routerLink="/dashboard/transactions">Transaction page</a>
            <a *ngIf="isAdmin()" routerLink="/dashboard/admin">Admin page</a>
            <a *ngIf="isAnalyst()" routerLink="/dashboard/analyst">Analyst page</a>
            <button type="button" class="logout-button" (click)="openLogoutConfirm()">Log Out</button>
        </nav>
    </aside>

    <main class="content">
        <router-outlet></router-outlet>
    </main>

    <div class="modal-backdrop" *ngIf="logoutConfirmOpen">
        <div class="modal">
            <h2>Confirm logout</h2>
            <p>Ești sigur că vrei să părăsești sesiunea?</p>
            <div class="modal-actions">
                <button type="button" class="secondary" (click)="closeLogoutConfirm()">Cancel</button>
                <button type="button" (click)="confirmLogout()">Confirm</button>
            </div>
        </div>
    </div>
</div>
