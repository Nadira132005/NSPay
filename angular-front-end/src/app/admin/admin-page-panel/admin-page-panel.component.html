<h2>{{ title }}</h2>

<table mat-table [dataSource]="transactionsData" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> id </th>
        <td mat-cell *matCellDef="let row"> {{ row.id }} </td>
    </ng-container>

    <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef> amount </th>
        <td mat-cell *matCellDef="let row"> {{ row.amount }} </td>
    </ng-container>

    <ng-container matColumnDef="cardNumber">
        <th mat-header-cell *matHeaderCellDef> cardNumber </th>
        <td mat-cell *matCellDef="let row"> •••• •••• •••• {{ row.cardNumber.slice(-4) }} </td>
    </ng-container>

    <ng-container matColumnDef="returnCode">
        <th mat-header-cell *matHeaderCellDef> returnCode </th>
        <td mat-cell *matCellDef="let row" [ngClass]="getTransactionStatusClass(row.returnCode)">
            {{ getTransactionStatusLabel(row.returnCode) }}
        </td>
    </ng-container>

    <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef> timestamp </th>
        <td mat-cell *matCellDef="let row"> {{ row.timestamp }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
