<div class="dashboard">
    <h1>User management</h1>
    <p class="subtitle">Create new platform users and assign the permissions they need.</p>

    <section class="panel">
        <form #adminForm="ngForm" (ngSubmit)="createUser()" class="user-form">
            <label>
                <span>Name</span>
                <input name="name" required [(ngModel)]="user.name" type="text" placeholder="New user name">
            </label>

            <label>
                <span>Password</span>
                <input name="password" required [(ngModel)]="user.password" type="password" placeholder="Temporary password">
            </label>

            <label>
                <span>Role</span>
                <select name="role" required [(ngModel)]="user.role">
                    <option [ngValue]="undefined" disabled>Select role</option>
                    <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
                </select>
            </label>

            <label>
                <span>Account</span>
                <select name="accountId" required [(ngModel)]="user.accountId">
                    <option [ngValue]="null" disabled>Select account</option>
                    <option *ngFor="let account of accountsData" [ngValue]="account.id">
                        {{ account.cardHolderName }} - {{ account.cardNumber }}
                    </option>
                </select>
            </label>

            <button type="submit" [disabled]="adminForm.invalid">Create user</button>
        </form>

        <p class="status" *ngIf="statusMessage">{{ statusMessage }}</p>
    </section>

    <table mat-table [dataSource]="usersData" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> id </th>
            <td mat-cell *matCellDef="let row"> {{ row.id }} </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> name </th>
            <td mat-cell *matCellDef="let row"> {{ row.name }} </td>
        </ng-container>

        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef> role </th>
            <td mat-cell *matCellDef="let row"> {{ row.role }} </td>
        </ng-container>

        <ng-container matColumnDef="account">
            <th mat-header-cell *matHeaderCellDef> account </th>
            <td mat-cell *matCellDef="let row">
                <select [(ngModel)]="row.accountId" [ngModelOptions]="{standalone: true}" (ngModelChange)="updateUserAccount(row)">
                    <option [ngValue]="null">No account</option>
                    <option *ngFor="let account of accountsData" [ngValue]="account.id">
                        {{ account.cardHolderName }} - {{ account.cardNumber }}
                    </option>
                </select>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> actions </th>
            <td mat-cell *matCellDef="let row">
                <button type="button" class="on-delete" (click)="deleteUser(row.id)">Delete</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['id', 'name', 'role', 'account', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['id', 'name', 'role', 'account', 'actions'];"></tr>
    </table>

    <div class="modal-backdrop" *ngIf="deleteConfirmOpen">
        <div class="modal">
            <h3>Are you sure?</h3>
            <p>This will delete the selected user.</p>
            <div class="modal-actions">
                <button type="button" class="modal-cancel" (click)="cancelDeleteUser()">Cancel</button>
                <button type="button" class="on-delete" (click)="confirmDeleteUser()">Delete</button>
            </div>
        </div>
    </div>
</div>
