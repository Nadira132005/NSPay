<main class="password-page">
    <form class="password-card" #passwordForm="ngForm" (ngSubmit)="submit()">
        <p class="eyebrow">Account security</p>
        <h1>Choose a new password</h1>
        <p class="intro">Your temporary password is your username. Set a new password to continue.</p>

        <label for="new-password">New password</label>
        <input id="new-password" name="password" type="password" required minlength="8"
               autocomplete="new-password" [(ngModel)]="password" placeholder="At least 8 characters">

        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirmPassword" type="password" required
               autocomplete="new-password" [(ngModel)]="confirmPassword" placeholder="Enter it again">

        <button type="submit" [disabled]="passwordForm.invalid || saving">Save password</button>
        <p class="status" role="alert" *ngIf="statusMessage">{{ statusMessage }}</p>
    </form>
</main>
