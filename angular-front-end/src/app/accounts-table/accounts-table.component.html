<div class="demo-button-container">
    <button
            [disabled]="isAccountsSelected"
            class="demo-button"
            (click)="showAccountsData()">
        Get Accounts
    </button>
    <button
            [disabled]="isTransactionsSelected"
            class="demo-button"
            (click)="showTransactionData()">
        Get All Transactions
    </button>

    <button
            [disabled]="!selection.hasValue()"
            class="demo-button"
            (click)="showTransactionDataByAccount(this.selection.selected)">
        Show Transactions
    </button>

    <button
            class="demo-button"
            (click)="createTransaction(this.selection.selected)">
        Create Transaction
    </button>
    <button
            class="demo-button"
            (click)="deleteSelectedAccount(this.selection.selected)">
        Delete
    </button>
</div>

<table mat-table [dataSource]="accountsData" class="mat-elevation-z8" *ngIf="isAccountsSelected">
    <ng-container [matColumnDef]="column" *ngFor="let column of displayedColumnsAccounts">
        <th mat-header-cell *matHeaderCellDef>
            <input type="checkbox"
                    *ngIf="column == 'id'"
                    (change)="masterToggle()"
                    [checked]="selection.hasValue() && isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()">
            {{ column }}
        </th>
        <td mat-cell *matCellDef="let row">
            <input type="checkbox"
                    *ngIf="column == 'id'"
                    (click)="$event.stopPropagation()"
                    (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)">
            {{ row[column] }}
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumnsAccounts"></tr>
    <tr mat-row *matRowDef="let emprow; columns: displayedColumnsAccounts;"></tr>
</table>


<table mat-table [dataSource]="transactionsData" class="mat-elevation-z8" *ngIf="isTransactionsSelected">
    <ng-container [matColumnDef]="column" *ngFor="let column of displayedColumnsTransactions">
        <th mat-header-cell *matHeaderCellDef> {{ column }}</th>
        <td mat-cell *matCellDef="let emp" [ngClass]="column === 'returnCode' ? getTransactionStatusClass(emp[column]) : ''">
            {{ column === 'returnCode' ? getTransactionStatusLabel(emp[column]) : emp[column] }}
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumnsTransactions"></tr>
    <tr mat-row *matRowDef="let emprow; columns: displayedColumnsTransactions;"></tr>
</table>
