springdoc.show-actuator=false
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# ?? Server
# Port the app listens on (default would be 8080)
server.port=8082

# ?? Database Connection
spring.datasource.username=${DB_USERNAME:payadmin}
spring.datasource.password=${DB_PASSWORD:paypassword}
# Replace 127.0.0.1 with your MySQL server's IP ("ip a" in terminal to find it)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:payments}}

# ?? JPA / Hibernate
# Automatically updates DB schema to match entities on startup (never drops data) - setare faina!!
spring.jpa.hibernate.ddl-auto=update
# SQL dialect for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Use exact field names as column names (no camelCase ? snake_case conversion)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Print SQL statements to console
spring.jpa.show-sql=false

# ?? Logging
# Log generated SQL queries
logging.level.org.hibernate.SQL=INFO
# Log actual parameter values bound to queries
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# ?? Connection Pool (HikariCP)
# Max simultaneous DB connections in the pool
spring.datasource.hikari.maximum-pool-size=10

# JWT
app.jwt.secret=${JWT_SECRET:local-dev-local-dev-local-dev-local-dev-local-dev}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.filter-enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=always
app.schedules.enabled=true
app.schedules.interval-ms=30000

market.twelve-data.api-key=${TWELVE_DATA_API_KEY:}

springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
