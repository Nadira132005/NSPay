springdoc.show-actuator=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# ?? Server
# Port the app listens on (default would be 8080)
server.port=8082

# ?? Database Connection
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:password}
# Replace 127.0.0.1 with your MySQL server's IP ("ip a" in terminal to find it)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/payments}

# ?? JPA / Hibernate
# Automatically updates DB schema to match entities on startup (never drops data) - setare faina!!
spring.jpa.hibernate.ddl-auto=update
# SQL dialect for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Use exact field names as column names (no camelCase ? snake_case conversion)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Print SQL statements to console
spring.jpa.show-sql=true

# ?? Logging
# Log generated SQL queries
logging.level.org.hibernate.SQL=DEBUG
# Log actual parameter values bound to queries
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ?? Connection Pool (HikariCP)
# Max simultaneous DB connections in the pool
spring.datasource.hikari.maximum-pool-size=10

# JWT
app.jwt.secret=${JWT_SECRET:local-dev-local-dev-local-dev-local-dev-local-dev}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.filter-enabled=true
